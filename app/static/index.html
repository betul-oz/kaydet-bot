<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaydet</title>
<style>
:root{
  --bg:#F3F2F6; --surface:#FFFFFF; --lane:#E9E7F0; --ink:#17151F; --muted:#5F5C6E; --line:#DAD7E4;
  --accent:#3A33D1; --accent-ink:#FFFFFF; --accent-soft:#E7E5FB;
  --danger:#B4182F; --ok:#1B6E46; --warn:#8F5400;
  --head:"Bahnschrift","Segoe UI Variable Display","SF Pro Display",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px; --rail:248px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121118; --surface:#1C1B25; --lane:#17161E; --ink:#F1EFF7; --muted:#A9A6BA; --line:#2E2C3B;
        --accent:#9A94FF; --accent-ink:#14121F; --accent-soft:#25234A;
        --danger:#FF8497; --ok:#6FD9A0; --warn:#FFC266;}
}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- Düzen ---- */
html,body{height:100%}
body{overflow:hidden}
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh;height:100dvh}
.rail{min-height:0;overflow:auto;padding:20px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.brand{font:600 22px var(--head);padding:0 10px 14px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;min-height:40px}
.navlink:hover{background:var(--accent-soft)}
.navlink[aria-current=page]{background:var(--surface);box-shadow:0 0 0 1px var(--line);font-weight:600}
.navlink .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.navlink .n{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.rail .sep{height:1px;background:var(--line);margin:10px 4px}
.rail .grow{flex:1}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{flex:0 0 auto;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:12px 24px;flex-wrap:wrap}
.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px}
.field::placeholder{color:var(--muted)}
.topbar input[type=search]{flex:1;min-width:180px;max-width:420px}
.view{flex:1;min-height:0;overflow:auto;padding:24px}
.view.cat{overflow:visible;display:flex;flex-direction:column}

/* ---- Düğmeler ---- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:7px 12px;min-height:38px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)} .btn.danger:hover{border-color:var(--danger)}
.btn.sm{min-height:32px;padding:3px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---- Menü (details) ---- */
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>summary:hover,details.menu[open]>summary{background:var(--accent-soft);color:var(--ink)}
.pop{position:absolute;right:0;top:38px;z-index:20;min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:6px;box-shadow:0 12px 32px rgba(20,16,40,.18);display:flex;flex-direction:column;gap:2px}
.pop button,.pop select{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;min-height:38px}
.pop button:hover,.pop select:hover{background:var(--accent-soft)}
.pop button.danger{color:var(--danger)}
.pop select{background:var(--surface);color:var(--ink)}
.pop .lbl{font-size:12px;color:var(--muted);padding:6px 10px 0}

/* ---- Kategori sayfası ---- */
.pagehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.pagehead h1{font-size:34px;line-height:1.1}
.pagehead .dot{width:14px;height:14px;border-radius:50%}
.pagehead .meta{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin:2px 0 22px}
.hint code{background:var(--accent-soft);padding:1px 6px;border-radius:6px;font-size:13px}
/* Sütunlar hep yan yana ve yukarıdan hizalı. Sütun alanı kendi içinde iki yöne kayar; yatay çubuk ekranın en altında sabit */
.lanes{flex:1;min-height:0;display:flex;gap:14px;align-items:flex-start;overflow:auto;padding:0 4px 14px 0;scrollbar-color:var(--muted) transparent;scrollbar-width:auto}
.lane{flex:0 0 320px;background:var(--lane);border:1px solid var(--line);border-radius:16px;padding:10px;min-height:140px}
.lane.over{outline:2px dashed var(--accent);outline-offset:-2px}
.lanehead{position:sticky;top:-10px;z-index:2;display:flex;align-items:center;gap:8px;margin:-10px -10px 4px;padding:12px 12px 10px 16px;background:var(--lane);border-radius:16px 16px 0 0}
.lanehead h3{font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere}
.lanehead .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.lane.add{background:none;border:2px dashed var(--line);display:grid;place-items:center;min-height:90px;color:var(--muted);cursor:pointer;font:inherit;text-align:center}
.lane.add:hover{border-color:var(--accent);color:var(--ink)}
.empty{color:var(--muted);font-size:14px;padding:14px 8px;text-align:center}

/* ---- Video kartı: dikey küçük resim solda ---- */
.card{display:grid;grid-template-columns:64px 1fr auto;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.card.drag{opacity:.4}
.thumb{width:64px;height:96px;border-radius:8px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;color:var(--muted);font:600 12px var(--head);text-decoration:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.ctitle{color:var(--ink);text-decoration:none;font-weight:600;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctitle:hover{text-decoration:underline}
.cmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:999px;padding:0 8px}
.st-bekliyor,.st-iniyor{color:var(--warn)} .st-indirildi{color:var(--ok)} .st-hata{color:var(--danger)}
textarea.note{width:100%;border:1px solid transparent;border-radius:8px;background:var(--bg);padding:5px 8px;font-size:13px;resize:vertical;min-height:32px}
textarea.note:hover{border-color:var(--line)}
.err{font-size:12px;color:var(--danger)}
.path{font-size:12px;color:var(--muted);overflow-wrap:anywhere}

/* ---- Arama sonuçları ve plan kartları ---- */
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:0 14px}
.where{font-size:12px;color:var(--accent);font-weight:600}
.plans{max-width:780px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.plan .head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.plan .head input{flex:1;font:600 18px var(--head)}
.plan textarea{width:100%;min-height:76px;resize:vertical}
.vid{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:10px 0}
.vid .num{width:22px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.vid .body{flex:1;min-width:0}
.vid input{width:100%;margin-top:6px;font-size:14px}
.newplan{display:flex;gap:8px;margin-bottom:20px}.newplan input{flex:1}

/* ---- Notlar (todo) ---- */
.notes{max-width:720px}
.addtodo{display:flex;gap:8px;margin:0 0 18px}.addtodo input{flex:1}
.todos{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-direction:column;gap:6px}
.todo{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.todo-text{flex:1;min-width:0;border:0;background:none;resize:none;padding:6px 6px;font:inherit;line-height:1.45;overflow:hidden;border-radius:6px}
.todo-text:focus{background:var(--bg)}
.is-done .todo-text{color:var(--muted);text-decoration:line-through}
.chk{position:relative;flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;cursor:pointer}
.chk input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.chk .box{width:20px;height:20px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center}
.chk input:checked+.box{background:var(--accent);border-color:var(--accent)}
.chk input:checked+.box::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.donehead{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.donehead h2{font-size:16px}.donehead .n{color:var(--muted);font-size:13px}

/* ---- Diyalog ve bildirim ---- */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(10,8,20,.45)}
dialog h2{font-size:20px;margin-bottom:6px}
dialog p{margin:6px 0 14px;color:var(--muted)}
dialog label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
dialog .field{width:100%}
dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;max-width:90vw;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---- Mobil: ray üstte yatay ---- */
@media (max-width:860px){
  .app{display:flex;flex-direction:column}
  .rail{flex:0 0 auto;flex-direction:row;align-items:center;gap:6px;padding:8px 10px;border-right:0;
    border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
  .brand{display:none} .rail nav{flex-direction:row;gap:4px} .rail .sep,.rail .grow{display:none}
  .navlink{white-space:nowrap;padding:8px 12px;background:var(--surface);border:1px solid var(--line)}
  .topbar{padding:10px 12px} .view{padding:14px 12px}
  .pagehead h1{font-size:28px} .view.cat .hint{display:none}
  .lanes{scroll-snap-type:x proximity} .lane{flex-basis:86vw;scroll-snap-align:start}
}
.app[data-view=notes] #q,.app[data-view=notes] #plat,.app[data-view=plans] #q,.app[data-view=plans] #plat,
.app[data-mode=analiz] #q,.app[data-mode=analiz] #plat,.app[data-mode=izle] #q,.app[data-mode=izle] #plat{display:none}
.modeswitch{margin-left:auto;display:inline-flex;background:var(--lane);border:1px solid var(--line);border-radius:999px;padding:3px}
.modeswitch a{padding:6px 16px;border-radius:999px;text-decoration:none;color:var(--muted);min-height:32px;display:inline-flex;align-items:center}
.modeswitch a[aria-current=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
/* ---- Analiz ---- */
.an{max-width:1100px}
.brandbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:18px}
.brandbox h2{font-size:22px;margin-bottom:10px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.kpi{background:var(--bg);border-radius:10px;padding:8px 14px;min-width:120px}
.kpi b{display:block;font:600 20px var(--head);font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--muted)}
.acc{border-top:1px solid var(--line);padding:10px 0}
.acchead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.acchead .plat{font-weight:600;min-width:84px}
.acchead .stat,.stat{color:var(--muted);font-size:13px}
.acchead .grow{flex:1}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;color:var(--muted);font-weight:500;padding:4px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.num,.tbl th.num{text-align:right}
.tbl a{color:var(--ink);text-decoration:none}.tbl a:hover{text-decoration:underline}
.x{display:inline-block;border-radius:999px;padding:0 8px;font-weight:600;background:var(--accent-soft)}
.x.hot{background:var(--ok);color:var(--bg)}.x.cold{background:none;color:var(--muted);border:1px solid var(--line)}
.scrollx{overflow-x:auto}
.chan{margin-bottom:26px}.chan h2{font-size:20px;margin-bottom:6px}
.banner{border-radius:14px;padding:12px 16px;margin:0 0 16px;background:var(--accent-soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.son{background:var(--warn);color:var(--bg)}.banner.bitti{background:var(--danger);color:var(--bg)}
.banner .grow{flex:1;min-width:200px}.banner .btn{color:var(--ink)}
.blanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:start;margin-bottom:22px}
.blane{background:var(--lane);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:90px}
.blane h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between}
.blane h3 .n{color:var(--muted);font-size:13px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.task b{overflow-wrap:anywhere}.task select,.task input{font-size:13px;min-height:32px;padding:3px 8px}
.newtask{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:8px;margin:0 0 16px}
.newtask>*,.newbatch>*{min-width:0}.newbatch{flex-wrap:wrap}.an{min-width:0}
@media (max-width:860px){.newtask{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.feed{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.msg{font-size:14px}.msg .who{font-weight:600;margin-right:6px}.msg.claude .who{color:var(--accent)}.msg.sistem{color:var(--muted)}.msg time{color:var(--muted);font-size:12px;margin-left:6px}
.sendmsg{display:flex;gap:8px;margin-top:8px}.sendmsg input{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---- Video inceleme ---- */
.rvlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.rvcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);text-decoration:none}
.rvcard:hover{border-color:var(--accent)}.rvcard b{overflow-wrap:anywhere}.rvcard .stat{color:var(--muted);font-size:13px}
.rvst{display:inline-flex;align-items:center;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.rvst.revizyon{background:#FFF1D6;color:var(--warn)}.rvst.onaylandi{background:#DDF3E8;color:var(--ok)}
@media (prefers-color-scheme: dark){.rvst.revizyon{background:#3A2C10}.rvst.onaylandi{background:#173326}}
.rvgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start;margin-top:12px}
@media (max-width:900px){.rvgrid{grid-template-columns:minmax(0,1fr)}}
.rvframe{background:#000;border-radius:14px;overflow:hidden;display:flex;justify-content:center}
.rvframe video{display:block;width:100%;max-height:68vh;background:#000}
.rv.short .rvframe video{width:auto;max-width:100%;height:68vh;aspect-ratio:9/16}
.rvtrack{position:relative;height:22px;margin:10px 2px 0;background:var(--lane);border-radius:999px;cursor:pointer}
.rvtrack i{position:absolute;top:3px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--accent)}
.rvtrack i.now{background:var(--danger);width:2px;margin-left:-1px;top:0;height:22px}
.rvstep{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0}
.rvstep .grow{flex:1}.rvstep output{font:600 16px var(--head);min-width:70px;text-align:center}
.rvform{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.rvform textarea{width:100%;resize:vertical;min-height:64px}.rvform .row{display:flex;gap:10px;align-items:center}
.rvform .tm{font:600 15px var(--head);color:var(--accent)}.rvform .row .grow{flex:1;color:var(--muted);font-size:13px}
.rvnotes{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 220px);overflow:auto}
.rvnotes h2{font-size:16px}.rvnote{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;border-top:1px solid var(--line);padding-top:8px}
.rvnote textarea{width:100%;resize:vertical;min-height:38px;background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 6px}
.rvnote textarea:hover,.rvnote textarea:focus{border-color:var(--line)}.rvnote p{margin:0;padding:4px 6px;overflow-wrap:anywhere}
.rvts{font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-radius:8px;padding:4px 8px;cursor:pointer;min-height:30px}
.rvbar{position:sticky;bottom:0;margin:18px -24px -24px;padding:12px 24px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
.rvbar .grow{flex:1;min-width:180px}.rvbar .go{min-height:44px;padding:8px 22px;font-size:16px}
@media (max-width:700px){.rvbar{margin:14px -12px -14px;padding:10px 12px}}
.rvhelp{color:var(--muted);font-size:13px;margin-top:6px}.rvhelp kbd{background:var(--lane);border:1px solid var(--line);border-radius:5px;padding:0 5px}

/* ---- Kanal ağacı (sol ray) ---- */
.railtitle{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px 6px}
.navrow{display:flex;align-items:center;gap:2px}.navrow .navlink{flex:1;min-width:0;justify-content:space-between;font-weight:600}
.navlink>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navlink .n{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400;flex:0 0 auto}
.chev{background:none;border:0;color:var(--muted);width:28px;min-height:36px;cursor:pointer;border-radius:8px;font-size:13px}.chev:hover{background:var(--accent-soft);color:var(--ink)}
.navlink.sub{margin-left:30px;min-height:34px;font-size:14px;justify-content:space-between}
.navlink.sub2{margin-left:46px;min-height:32px;font-size:13px;color:var(--muted);justify-content:space-between}
/* ---- Kanal sayfası ---- */
.rvtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 6px}
.rvtools .chip{cursor:pointer;background:var(--surface);padding:3px 12px;min-height:30px}.rvtools .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rvsec{margin:18px 0 6px}.rvsec.l2{margin-left:18px;padding-left:14px;border-left:2px solid var(--line)}
.sechead{display:flex;align-items:center;gap:8px;margin-bottom:6px}.sechead h2{font-size:19px}.sechead h3{font-size:16px;color:var(--ink)}.sechead .n{color:var(--muted);font-size:13px}
.crumb{color:var(--muted);font-size:13px;margin-top:14px}
.rvrows{display:flex;flex-direction:column;gap:6px}
.rvrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px}
.rvrow.is-done{opacity:.6}.rvmain{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;color:var(--ink);text-decoration:none;min-height:36px;align-items:center;flex-wrap:wrap}
.rvmain:hover .rtitle{text-decoration:underline}.rvmain .ico{color:var(--accent);font-size:13px;width:16px;text-align:center}
.rtitle{font-weight:600;overflow-wrap:anywhere}.rmeta{color:var(--muted);font-size:13px}
.rvrow .menu{position:relative}
/* ---- Metin okuyucu ---- */
.rd{--fs:19px}.rdtools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.rdoc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-size:var(--fs);line-height:1.7;max-height:calc(100vh - 260px);overflow:auto}
.ln{position:relative;padding-right:34px;white-space:pre-wrap;overflow-wrap:anywhere}.ln.blank{min-height:.8em}
.lnedit{user-select:none;position:absolute;right:0;top:2px;opacity:0;background:none;border:0;cursor:pointer;font-size:.7em}.ln:hover .lnedit,.lnedit:focus-visible{opacity:1}
.ln.editing{padding-right:0;margin:6px 0}.ln.editing textarea,.rdall{width:100%;font-size:inherit;line-height:1.5;min-height:80px}.rdall{min-height:55vh}
.rdedit{display:flex;gap:8px;align-items:center;margin-top:8px}
mark{background:#FFE58A;color:#241d00;border-radius:3px;padding:0 1px}mark.done{background:#CFEBD9}mark.flash{outline:3px solid var(--accent)}
@media (prefers-color-scheme: dark){mark{background:#6B5A12;color:#FFF3C4}mark.done{background:#1F4A33;color:#D9F5E6}}
.dir{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;font-size:.78em;line-height:1.5;vertical-align:.1em}
.nodir .dir{display:none}
.rddiff{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}.dhunk{margin:6px 0}.dhunk small{color:var(--muted)}
.dl{font-size:13px;line-height:1.45;border-radius:6px;padding:2px 6px;margin:2px 0;overflow-wrap:anywhere}.dl.del{background:#FBE3E6;color:#7A1020}.dl.add{background:#DDF3E8;color:#14553A}
@media (prefers-color-scheme: dark){.dl.del{background:#3A1A20;color:#FFB4BF}.dl.add{background:#173326;color:#A8EBC8}}
.rvcm{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.rvcm .quote{text-align:left;background:var(--lane);border:0;border-left:3px solid var(--accent);border-radius:6px;padding:6px 8px;color:var(--muted);cursor:pointer;font-size:13px}
.rvcm textarea{width:100%;resize:vertical;background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 8px}.rvcm p{margin:0;overflow-wrap:anywhere}
.rvcm .cmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.rvcm .cmeta .btn{margin-left:auto}
.cnote{background:var(--accent-soft);border-radius:8px;padding:6px 8px;font-size:13px}.quote2{border-left:3px solid var(--accent);padding-left:8px;color:var(--muted);font-size:14px}
.insights{margin:8px 0 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.insights .ihead{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.insights .igrp.wide{grid-column:1/-1}
.insights h4{margin:0 0 6px;font:600 13px var(--head)}.insights h4 small{color:var(--ok);font-weight:600;margin-left:6px}
.icells{display:flex;flex-wrap:wrap;gap:6px}.icell{min-width:52px;border:1px solid var(--line);border-radius:10px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.icell span{font-weight:700}.icell small{color:var(--muted);font-size:11px}.icell.few{opacity:.55}
dialog:has(.pdlg){width:min(720px,94vw);max-width:94vw;overflow-x:hidden}.pdlg{width:100%}.pdlg textarea{box-sizing:border-box;white-space:pre-wrap;overflow-wrap:anywhere}.pdlg .psteps{margin:6px 0 10px;padding-left:20px;color:var(--muted);font-size:14px}
.pdlg textarea{width:100%;font:13px/1.5 ui-monospace,Consolas,monospace;resize:vertical}
.pdlg .actions{margin-top:10px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.pdlg .actions #pshort{margin-right:auto}

/* ---- Analiz: marka / hesap / plan ---- */
.grow{flex:1}.ext{color:var(--muted);text-decoration:none;margin-left:2px}
.vchip{display:inline-flex;align-items:center;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;background:var(--lane);color:var(--muted)}
.vchip.ok{background:#DDF3E8;color:var(--ok)}.vchip.bad{background:#FBE3E6;color:var(--danger)}.vchip.warn{background:#FFF1D6;color:var(--warn)}
@media (prefers-color-scheme: dark){.vchip.ok{background:#173326}.vchip.bad{background:#3A1A20}.vchip.warn{background:#3A2C10}}
.brandgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.brandcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);text-decoration:none}
.brandcard:hover{border-color:var(--accent)}.bch{display:flex;gap:8px;align-items:center;justify-content:space-between}.bch b{font:600 18px var(--head)}.brec{color:var(--muted);line-height:1.35}
.pbar{height:10px;background:var(--lane);border-radius:999px;overflow:hidden;margin:10px 0}.pbar.sm{height:6px;margin:4px 0}.pbar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.planbox{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.planbox .ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.planbox h2{font-size:19px}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:6px 0}.pstats div{display:flex;flex-direction:column}.pstats b{font:600 18px var(--head)}.pstats span{color:var(--muted);font-size:12px}
.pnote{margin:8px 0;line-height:1.5}.pitems{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:4px}.pitems li{font-size:14px}.pitems li.od b{color:var(--danger)}
.bulk summary{cursor:pointer;color:var(--accent);margin-top:6px}.bulk textarea{width:100%;margin:8px 0}.bulk .row{display:flex;gap:8px;flex-wrap:wrap}
.recs{display:flex;flex-direction:column;gap:8px}.rec{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:8px 12px;background:var(--surface)}
.rec.yap{border-left-color:var(--ok)}.rec.birak{border-left-color:var(--danger)}.rec.uyari{border-left-color:var(--warn)}.rec.dene{border-left-color:var(--accent)}.rec.bilgi{border-left-color:var(--line)}
.rec .ric{font-size:18px;line-height:1.3}.rlb{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.hl h4{margin:0 0 6px;font:600 14px var(--head)}.hl ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

.vscores{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.vsc{min-width:84px;border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;background:var(--lane)}
.vsc b{font:700 22px var(--head)}.vsc span{font-size:12px;color:var(--muted)}.vsc.ok b{color:var(--ok)}.vsc.warn b{color:var(--warn)}.vsc.bad b{color:var(--danger)}
.vticks{position:relative;height:16px;margin-top:2px;font-size:11px;color:var(--muted)}.vticks span{position:absolute;transform:translateX(-2px)}
.vatl{width:100%;height:110px;display:block;background:var(--lane);border-radius:10px;margin-top:6px}.vb{fill:var(--accent)}.vb.low{fill:var(--danger);opacity:.8}.vc{stroke:var(--ok);stroke-width:.12;opacity:.9}
.vhook{fill:var(--accent-soft);opacity:.9}.vlow{fill:none;stroke:var(--danger);stroke-width:.15;stroke-dasharray:.6 .4}.vt{font-size:2.6px;fill:var(--muted)}
.vleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0}.vleg .lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.lg.hook{background:var(--accent-soft);border:1px solid var(--accent)}.lg.low{background:var(--danger)}.lg.cut{background:var(--ok)}
.vnums{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}.vnums div{display:flex;flex-direction:column}.vnums b{font:600 16px var(--head)}.vnums span{font-size:12px;color:var(--muted)}
.vsec{margin:14px 0 6px;font:600 15px var(--head)}.vbrief{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px solid var(--line);margin:4px 0;background:var(--surface)}
.vbrief.sorun{border-left:4px solid var(--danger)}.vbrief.dikkat{border-left:4px solid var(--warn)}.vbrief.iyi{border-left:4px solid var(--ok)}.vwhen{font-weight:600;color:var(--accent);margin-right:4px}.vfix{margin-top:4px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Kategoriler">
    <div class="brand">Kaydet</div>
    <nav id="catnav"></nav>
    <button class="btn ghost sm" data-act="catadd" id="catadd">+ Yeni kategori</button>
    <div class="sep"></div>
    <nav id="extranav"><a class="navlink" id="plannav" href="#/planlar">Plan kartları <span class="n" id="plancount"></span></a>
      <a class="navlink" id="notenav" href="#/notlar">Notlar <span class="n" id="notecount"></span></a>
      <a class="navlink" id="orphannav" href="#/kategorisiz" hidden>Kategorisiz <span class="n" id="orphancount"></span></a></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <label class="sr" for="q">Tüm kategorilerde ara</label>
      <input class="field" type="search" id="q" placeholder="Tüm kategorilerde ara…">
      <label class="sr" for="plat">Platform</label>
      <select class="field" id="plat"><option value="">Tüm platformlar</option><option>instagram</option><option>tiktok</option><option>youtube</option></select>
      <nav class="modeswitch" aria-label="Görünüm"><a href="#/" id="swkaydet">Kaydet</a><a href="#/analiz" id="swanaliz">Analiz</a><a href="#/izle" id="swizle">Videolar</a><a href="#/metin" id="swmetin">Metinler</a></nav>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const HUES = ['#E5484D','#E5720B','#C79A00','#2E9E6B','#0D95A6','#3E63DD','#8E4EC6','#CF3F9A'];
const S = {cats: [], items: [], cards: [], todos: [], q: '', plat: '', dl: false, saving: Promise.resolve(), sig: '', lastError: '', an: null, anOpen: new Set(), board: null, boardSig: ''};
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? u : '#';
// Türkçe İ/I/ı farkını ve harf boyutunu yok sayan karşılaştırma (sunucudaki fold() ile aynı kural)
const fold = (t) => String(t ?? '').replace(/[İIı]/g, 'i').toLowerCase().replace(/[_-]/g, ' ').replace(/\s+/g, ' ').trim();
const hue = (name) => HUES[Math.max(0, S.cats.findIndex(c => c.name === name)) % HUES.length];
const orphans = () => S.items.filter(i => !S.cats.some(c => c.name === i.category && c.subs.includes(i.subcategory)));
const count = (cat, sub) => S.items.filter(i => i.category === cat && (sub === undefined || i.subcategory === sub)).length;

// Yazma işlemleri sırayla yapılır; load() ve Kopyala bekleyenlerin bitmesini bekler (eski metin görünmesin/kopyalanmasın)
function track(fn) { const p = S.saving.then(fn).catch(() => {}); S.saving = p; return p; }
const run = (m, u, b) => track(() => api(m, u, b));

async function api(method, url, body) {
  let r;
  try { r = await fetch(url, {method, headers: body ? {'Content-Type': 'application/json'} : {}, body: body ? JSON.stringify(body) : undefined}); }
  catch (e) { S.lastError = 'Sunucuya ulaşılamadı'; toast('Sunucuya ulaşılamadı. python -m app çalışıyor mu?'); throw e; }
  if (r.status === 401) { location.href = '/login'; throw new Error('Giriş gerekli'); }
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch (e) {} S.lastError = m; toast(m); throw new Error(m); }
  return (r.headers.get('content-type') || '').includes('json') ? r.json() : r.text();
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

async function load(force) {
  await S.saving;
  const [st, cards, todos] = await Promise.all([api('GET', '/api/state'), api('GET', '/api/cards'), api('GET', '/api/todos')]);
  const sig = JSON.stringify([st, cards, todos]);
  if (sig === S.sig && !force) return;
  S.loaded = true; S.sig = sig; S.cats = st.categories; S.items = st.items; S.dl = st.downloads_enabled; S.cards = cards; S.todos = todos; render();
}

/* ---------- Yönlendirme: #/k/<kategori> | #/planlar ---------- */
function route() {
  let h = ''; try { h = decodeURIComponent(location.hash || ''); } catch (e) {}
  if (h === '#/analiz' || h.startsWith('#/analiz/')) {
    const rest = h.slice(9).replace(/^\//, ''); let am;
    if ((am = rest.match(/^b\/(\d+)$/))) return {view: 'analytics', brandId: +am[1]};
    if ((am = rest.match(/^h\/(\d+)$/))) return {view: 'analytics', account: +am[1]};
    if ((am = rest.match(/^v\/(\d+)$/))) return {view: 'analytics', post: +am[1]};
    return {view: 'analytics', brand: rest};
  }
  if (h === '#/izle' || h === '#/metin') return {view: 'reviews', sec: h.slice(2)};
  const km = h.match(/^#\/(izle|metin)\/k\/(\d+)(?:\/(\d+))?$/); if (km) return {view: 'channel', sec: km[1], ch: +km[2], cat: +(km[3] || 0)};
  const mm = h.match(/^#\/(?:izle|metin)\/m\/(\d+)$/); if (mm) return {view: 'doc', sec: 'metin', id: +mm[1]};
  const rm = h.match(/^#\/izle\/(\d+)$/); if (rm) return {view: 'reviewer', id: +rm[1]};
  if (h === '#/kanallar') return {view: 'channels'};
  if (h === '#/pano') return {view: 'board'};
  if (h === '#/planlar') return {view: 'plans'};
  if (h === '#/kategorisiz') return {view: 'orphans'};
  if (h === '#/notlar') return {view: 'notes'};
  const m = h.match(/^#\/k\/(.+)$/);
  const cat = S.cats.find(c => c.name === (m && m[1])) || S.cats[0];
  return {view: 'cat', cat};
}
window.addEventListener('hashchange', () => { render(); const v = $('#view'); v.scrollTop = 0; const l = $('#view .lanes'); if (l) { l.scrollTop = 0; l.scrollLeft = 0; } });

/* ---------- Bileşenler ---------- */
function itemCard(it, showWhere) {
  const thumb = /^https?:/i.test(it.thumb_url) ? `<img src="${esc(it.thumb_url)}" loading="lazy" referrerpolicy="no-referrer" alt="" data-ph="${esc(it.platform.slice(0, 2).toUpperCase())}" onerror="this.parentNode.textContent=this.dataset.ph">` : esc(it.platform.slice(0, 2).toUpperCase());
  const status = it.status === 'kayitli' ? '' : `<span class="st-${esc(it.status)}">${{bekliyor:'sırada', iniyor:'iniyor…', indirildi:'indirildi', hata:'hata'}[it.status] || esc(it.status)}</span>`;
  const canDl = S.dl && !['indirildi', 'bekliyor', 'iniyor'].includes(it.status);
  const moveOpts = S.cats.map((c, ci) => c.subs.map((s, si) => `<option value="${ci}:${si}">${esc(c.name)} / ${esc(s)}</option>`).join('')).join('');
  return `<article class="card" draggable="true" data-id="${it.id}">
    <a class="thumb" href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener noreferrer" aria-label="Videoyu aç">${thumb}</a>
    <div class="cbody">
      ${showWhere ? `<span class="where">${esc(it.category)} / ${esc(it.subcategory)}</span>` : ''}
      <a class="ctitle" href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener noreferrer">${esc(it.title || it.url)}</a>
      <div class="cmeta"><span class="chip">${esc(it.platform)}</span>${status}
        ${canDl ? `<button class="btn sm" data-act="dl" data-id="${it.id}">${it.status === 'hata' ? 'Tekrar dene' : 'İndir'}</button>` : ''}</div>
      <textarea class="note" data-id="${it.id}" rows="1" placeholder="Not ekle" aria-label="Not">${esc(it.note)}</textarea>
      ${it.error ? `<div class="err">${esc(it.error)}</div>` : ''}
      ${it.file_path ? `<div class="path">${esc(it.file_path)}</div>` : ''}
    </div>
    <details class="menu"><summary aria-label="Video işlemleri">⋯</summary><div class="pop">
      <div class="lbl">Plan kartına ekle</div>
      <select data-act="addcard" data-id="${it.id}" aria-label="Plan kartına ekle"><option value="">Kart seç…</option>${S.cards.map(c => `<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select>
      <div class="lbl">Taşı</div>
      <select data-act="moveitem" data-id="${it.id}" aria-label="Başka başlığa taşı"><option value="">Başlık seç…</option>${moveOpts}</select>
      ${it.file_path ? `<button data-act="cpath" data-id="${it.id}">Dosya yolunu kopyala</button>` : ''}
      <button class="danger" data-act="del" data-id="${it.id}">Videoyu sil</button>
    </div></details>
  </article>`;
}

const matches = (it) => (!S.plat || it.platform === S.plat) &&
  (!S.q || [it.title, it.note, it.url, it.category, it.subcategory].some(v => fold(v).includes(fold(S.q))));

function renderNav(r) {
  const iz = RVVIEWS.includes(r.view), an = ['analytics', 'channels', 'board'].includes(r.view);
  $('#swkaydet').setAttribute('aria-current', String(!an && !iz)); $('#swanaliz').setAttribute('aria-current', String(an));
  const sec = rvSec(r); $('#swizle').setAttribute('aria-current', String(iz && sec === 'izle')); $('#swmetin').setAttribute('aria-current', String(iz && sec === 'metin'));
  $('#catadd').hidden = an || iz; $('#extranav').hidden = an || iz;
  if (iz) { renderReviewNav(r); return; }
  if (an) {
    const bs = (S.an && S.an.brands) || [];
    const bd = S.board && S.board.tasks.filter(t => t.status !== 'yuklendi').length;
    $('#catnav').innerHTML = `<a class="navlink" href="#/pano" ${r.view === 'board' ? 'aria-current="page"' : ''}>İş panosu<span class="n">${bd || ''}</span></a>` +
      `<a class="navlink" href="#/kanallar" ${r.view === 'channels' ? 'aria-current="page"' : ''}>Kanal tabloları</a><div class="sep"></div>` +
      `<a class="navlink" href="#/analiz" ${r.view === 'analytics' && !r.brand && !r.brandId && !r.account && !r.post ? 'aria-current="page"' : ''}>Tüm markalar<span class="n">${bs.length}</span></a>` +
      bs.map(b => { const curB = r.view === 'analytics' && (r.brandId === b.id || (r.account && b.accounts.some(x => x.id === r.account)) || (r.post && b.accounts.some(x => x.posts.some(y => y.id === r.post))));
        const col = {zamaninda: 'var(--ok)', bitti: 'var(--ok)', gecikme: 'var(--danger)', 'gecikmis-var': 'var(--warn)'}[b.plan && b.plan.verdict] || 'var(--line)';
        return `<a class="navlink" href="#/analiz/b/${b.id}" ${curB ? 'aria-current="page"' : ''}><span class="dot" style="background:${col}" title="Plan durumu"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.brand)}</span><span class="n">${b.accounts.length}</span></a>`; }).join('') +
      `<button class="btn ghost sm" data-an="brandadd" style="margin:6px 6px 0">+ Marka</button>`;
    return;
  }
  $('#catnav').innerHTML = S.cats.map(c => `<a class="navlink" href="#/k/${encodeURIComponent(c.name)}" ${r.view === 'cat' && r.cat === c ? 'aria-current="page"' : ''}>
      <span class="dot" style="background:${hue(c.name)}"></span>${esc(c.name)}<span class="n">${count(c.name)}</span></a>`).join('');
  const o = orphans().length;
  $('#orphannav').hidden = !o; $('#orphancount').textContent = o || '';
  $('#orphannav').setAttribute('aria-current', r.view === 'orphans' ? 'page' : 'false');
  $('#plannav').setAttribute('aria-current', r.view === 'plans' ? 'page' : 'false');
  $('#notenav').setAttribute('aria-current', r.view === 'notes' ? 'page' : 'false');
  $('#notecount').textContent = S.todos.filter(t => !t.done).length || '';
  $('#plancount').textContent = S.cards.length || '';
}

function renderCategory(cat) {
  const oldLanes = $('#view .lanes');
  const keep = oldLanes && oldLanes.dataset.cat === cat.name ? [oldLanes.scrollLeft, oldLanes.scrollTop] : null;
  const total = count(cat.name);
  const ex = cat.subs[0] ? `${cat.name.replace(/ /g, '_')}/${cat.subs[0].replace(/ /g, '_')}` : '';
  const lanes = cat.subs.map((s, si) => {
    const list = S.items.filter(i => i.category === cat.name && i.subcategory === s);
    return `<section class="lane" data-cat="${esc(cat.name)}" data-sub="${esc(s)}" aria-label="${esc(s)}">
      <div class="lanehead"><h3>${esc(s)}</h3><span class="n">${list.length}</span>
        <details class="menu"><summary aria-label="${esc(s)} işlemleri">⋯</summary><div class="pop">
          <button data-act="subrename" data-sub="${esc(s)}">Yeniden adlandır</button>
          ${si > 0 ? `<button data-act="submove" data-dir="-1" data-sub="${esc(s)}">Sola taşı</button>` : ''}
          ${si < cat.subs.length - 1 ? `<button data-act="submove" data-dir="1" data-sub="${esc(s)}">Sağa taşı</button>` : ''}
          ${S.dl && list.length ? `<button data-act="dlsub" data-sub="${esc(s)}">Hepsini indir</button>` : ''}
          <button class="danger" data-act="subdel" data-sub="${esc(s)}">Başlığı sil</button>
        </div></details></div>
      ${list.map(i => itemCard(i)).join('') || '<div class="empty">Henüz video yok. Bota link at ya da bir videoyu buraya sürükle.</div>'}
    </section>`;
  }).join('');
  $('#view').innerHTML = `<div class="pagehead"><span class="dot" style="background:${hue(cat.name)}"></span><h1 tabindex="-1">${esc(cat.name)}</h1>
      <span class="meta">${total} video</span><span style="flex:1"></span>
      <button class="btn sm" data-act="subadd">+ Alt başlık</button>
      <details class="menu"><summary aria-label="Kategori işlemleri">⋯</summary><div class="pop">
        <button data-act="catrename">Kategoriyi yeniden adlandır</button>
        ${S.cats.indexOf(cat) > 0 ? '<button data-act="catmove" data-dir="-1">Listede yukarı taşı</button>' : ''}
        ${S.cats.indexOf(cat) < S.cats.length - 1 ? '<button data-act="catmove" data-dir="1">Listede aşağı taşı</button>' : ''}
        <button class="danger" data-act="catdel">Kategoriyi sil</button></div></details></div>
    <p class="hint">${ex ? `Botta kısa yol: linkin yanına <code>${esc(ex)}</code> yaz, sormadan buraya kaydeder.` : ''}</p>
    <div class="lanes" data-cat="${esc(cat.name)}" tabindex="0" role="region" aria-label="${esc(cat.name)} alt başlıkları">${lanes}</div>`;
  const nl = $('#view .lanes');
  if (keep && nl) { nl.scrollLeft = keep[0]; nl.scrollTop = keep[1]; }  // yeniden çizimde kaydırma yerinde kalsın
}

function renderSearch() {
  const list = S.items.filter(matches);
  $('#view').innerHTML = `<div class="pagehead"><h1>Arama</h1><span class="meta">${list.length} sonuç</span></div><p class="hint"></p>` +
    (list.length ? `<div class="results">${list.map(i => itemCard(i, true)).join('')}</div>` : '<p class="empty">Eşleşen video yok. Aramayı kısaltmayı veya platform filtresini kaldırmayı dene.</p>');
}

function renderOrphans() {
  const list = orphans();
  $('#view').innerHTML = `<div class="pagehead"><h1 tabindex="-1">Kategorisiz</h1><span class="meta">${list.length} video</span></div>
    <p class="hint">Bu videoların kategorisi artık yok. Her birinin ⋯ menüsünden bir başlığa taşı.</p>` +
    (list.length ? `<div class="results">${list.map(i => itemCard(i, true)).join('')}</div>` : '<p class="empty">Kategorisiz video kalmadı.</p>');
}

function renderPlans() {
  const opts = (c) => S.items.filter(i => !c.items.some(x => x.id === i.id))
    .map(i => `<option value="${i.id}">[${esc(i.category)}/${esc(i.subcategory)}] ${esc((i.title || i.url).slice(0, 60))}</option>`).join('');
  $('#view').innerHTML = `<div class="plans"><div class="pagehead"><h1>Plan kartları</h1></div>
    <p class="hint">Bir plan kartında videoları ve kendi notlarını topla, <b>Kopyala</b> ile hepsini tek metin olarak Claude'a yapıştır.</p>
    <div class="newplan"><input class="field" id="newtitle" placeholder="Yeni kart başlığı, örn. Cuma reels" aria-label="Yeni kart başlığı">
      <button class="btn primary" data-act="newcard">Kart oluştur</button></div>
    ${S.cards.map(c => `<section class="plan" data-card="${c.id}">
      <div class="head"><input class="field" data-act="ctitle" value="${esc(c.title)}" aria-label="Kart başlığı">
        <button class="btn primary" data-act="copy">Kopyala</button>
        <details class="menu"><summary aria-label="Kart işlemleri">⋯</summary><div class="pop"><button class="danger" data-act="delcard">Kartı sil</button></div></details></div>
      <textarea class="field" data-act="cnote" placeholder="Kendi notların: metin, fikir, açıklama…" aria-label="Kart notu">${esc(c.note)}</textarea>
      ${c.items.map((v, n) => `<div class="vid" data-item="${v.id}"><span class="num">${n + 1}.</span><div class="body">
          <span class="where">${esc(v.category)} / ${esc(v.subcategory)}</span><br>
          <a class="ctitle" href="${esc(safeUrl(v.url))}" target="_blank" rel="noopener noreferrer">${esc(v.title || v.url)}</a>
          <input class="field" data-act="vnote" value="${esc(v.card_note)}" placeholder="Bu videoyla ilgili notum" aria-label="Video notu"></div>
          <button class="btn sm" data-act="up" aria-label="Yukarı taşı">↑</button><button class="btn sm" data-act="down" aria-label="Aşağı taşı">↓</button>
          <button class="btn sm danger" data-act="rmvid" aria-label="Karttan çıkar">✕</button></div>`).join('')}
      <div style="margin-top:8px"><select class="field" data-act="addvid" aria-label="Karta video ekle"><option value="">Karta video ekle…</option>${opts(c)}</select></div>
    </section>`).join('') || '<p class="empty">Henüz plan kartı yok. Yukarıya bir başlık yazıp oluştur.</p>'}</div>`;
}

function render() {
  if (!S.loaded) return;  // ilk veri gelmeden çizme (kategori yoksa da çizilir: yayındaki sunucuda Kaydet kategorileri boş olabilir)
  const r = route();
  document.querySelector('.app').dataset.view = r.view;
  document.querySelector('.app').dataset.mode = ['analytics', 'channels', 'board'].includes(r.view) ? 'analiz' : RVVIEWS.includes(r.view) ? 'izle' : 'kaydet';
  const hadLanesFocus = document.activeElement === document.querySelector('.lanes');
  renderNav(r);
  const view = $('#view');
  view.className = 'view';
  if (r.view === 'analytics') renderAnalytics(r);
  else if (r.view === 'channels') renderChannels();
  else if (r.view === 'board') renderBoard();
  else if (r.view === 'reviews') renderReviews(r);
  else if (r.view === 'channel') renderChannel(r);
  else if (r.view === 'doc') renderDoc(r);
  else if (r.view === 'reviewer') renderReviewer(r);
  else if (r.view === 'plans') renderPlans();
  else if (r.view === 'notes') renderNotes();
  else if (S.q || S.plat) renderSearch();
  else if (r.view === 'orphans') renderOrphans();
  else if (!r.cat) view.innerHTML = '<p class="empty">Henüz kategori yok. Soldaki “+ Yeni kategori” ile ekle; video ve metin incelemesi için üstten <a href="#/izle">Videolar</a> ya da <a href="#/metin">Metinler</a>’e geç.</p>';
  else { view.className = 'view cat'; renderCategory(r.cat); }
  if (hadLanesFocus) document.querySelector('.lanes')?.focus({preventScroll: true});  // yenilemede odak kaybolmasın
}

/* ---------- Analiz ---------- */
const PLAT = {youtube: 'YouTube', tiktok: 'TikTok', instagram: 'Instagram'};
const fmt = (n) => n == null ? '–' : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + ' Mn' : n >= 1e4 ? Math.round(n / 1e3) + ' B' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + ' B' : String(n);
const fday = (d) => (d || '').slice(0, 10) || '–';
const fdate = (iso) => iso ? new Date(iso.slice(0, 10) + 'T00:00:00').toLocaleDateString('tr-TR', {day: 'numeric', month: 'long'}) : '–';
const xs = (v) => v == null ? '–' : v + '×';
const pc = (v) => v == null ? '–' : '%' + v;
async function loadAnalytics() { S.an = await api('GET', '/api/analytics'); render(); }
const VERDICT = {zamaninda: ['Zamanında', 'ok'], gecikme: ['Gecikme riski', 'bad'], 'gecikmis-var': ['Gecikmiş iş var', 'warn'], 'hiz-yok': ['Hız verisi yok', 'muted'], bitti: ['Bitti', 'ok'], 'plan-yok': ['Plan yok', 'muted']};
const verdictChip = (p) => { const [l, c] = VERDICT[p.verdict] || ['', 'muted']; return `<span class="vchip ${c}">${l}</span>`; };
const LEVEL = {yap: ['✅', 'Yap'], birak: ['⛔', 'Bırak'], dene: ['🧪', 'Dene'], uyari: ['⚠️', 'Dikkat'], bilgi: ['ℹ️', 'Bilgi']};
const allAccounts = () => (S.an?.brands || []).flatMap(b => b.accounts);
const findBrand = (id) => (S.an?.brands || []).find(b => b.id === id);
const findAcc = (id) => allAccounts().find(a => a.id === id);
const accLabel = (a) => `${PLAT[a.platform]} @${a.handle}`;

function postsTable(a) {
  const rows = [...a.posts].sort((x, y) => (y.outlier || 0) - (x.outlier || 0)).map(p => {
    const o = p.outlier, cls = o >= 2 ? 'hot' : o != null && o < 0.7 ? 'cold' : '';
    return `<tr><td><a href="#/analiz/v/${p.id}" title="Video analizi">${esc((p.title || p.url).slice(0, 90))}</a> <a class="ext" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener noreferrer" aria-label="Platformda aç" title="Platformda aç">↗</a></td>
      <td>${fday(p.posted_at)}</td><td class="num">${p.duration != null ? p.duration + ' sn' : '–'}</td>
      <td class="num">${fmt(p.views)}</td><td class="num">${fmt(p.likes)}</td><td class="num">${fmt(p.comments)}</td>
      <td class="num">${pc(p.engagement)}</td>
      <td class="num">${o != null ? `<span class="x ${cls}" title="${esc(`Taban: ${p.base_scope === 'biçim' ? 'aynı biçim' : 'tüm hesap'} (${p.base_n} video) · z ${p.z ?? '–'} · izlenme/abone ${p.vsr ?? '–'} · yaş ${p.age_days ?? '–'} gün`)}">${o}×</span>${p.hot ? ' 🔥' : ''}${p.suspicious ? ' <span title="Beğeni/1000 izlenme çok düşük: reklam ya da şüpheli trafik olabilir">⚠</span>' : ''}${!p.reliable ? ' <span class="stat" title="Taban 10 videodan az">az veri</span>' : ''}` : '–'}</td>
      <td class="num">${p.vph != null ? fmt(Math.round(p.vph)) + '/sa' : '–'}</td></tr>`;
  }).join('');
  return `<div class="scrollx"><table class="tbl"><thead><tr><th>Video (en güçlüden)</th><th>Tarih</th><th class="num">Süre</th><th class="num">İzlenme</th><th class="num">Beğeni</th><th class="num">Yorum</th><th class="num">Etkileşim</th><th class="num" title="İzlenme ÷ aynı hesap ve aynı biçimdeki diğer olgun videoların medyanı">Güç</th><th class="num" title="Son iki ölçüm arasındaki saatlik izlenme">Hız</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function recsBlock(recs, who) {
  if (!recs || !recs.length) return '<p class="empty">Öneri çıkarmak için yeterli veri yok. Hesabın videolarını çek.</p>';
  return `<div class="recs">${recs.map(r => { const [ic, lb] = LEVEL[r.level] || ['', '']; return `<div class="rec ${esc(r.level)}"><span class="ric" aria-hidden="true">${ic}</span><div><b class="rlb">${lb}</b>${who ? ` <small class="stat">${esc(who)}</small>` : ''}<div>${esc(r.text)}</div><small class="stat">${esc(r.why)}</small></div></div>`; }).join('')}</div>`;
}

function highlightsBlock(h) {
  if (!h || (!h.top.length && !h.weak.length)) return '';
  const li = (v) => `<li><a href="#/analiz/v/${v.id}">${esc((v.title || '').slice(0, 70))}</a> <span class="stat">${xs(v.power)} · ${fmt(v.views)} izlenme${v.engagement != null ? ' · ' + pc(v.engagement) : ''}</span></li>`;
  return `<div class="hl"><div><h4>🔥 En çok tutanlar</h4><ul>${h.top.map(li).join('')}</ul></div><div><h4>🧊 En zayıf kalanlar <small class="stat">olgun videolar</small></h4><ul>${h.weak.map(li).join('')}</ul></div></div>`;
}

function insightsBlock(a) {
  const I = a.insights; if (!I || !I.n_scored) return '';
  const cell = (label, g) => `<div class="icell ${g.few ? 'few' : ''}" title="${g.n} video${g.few ? ' (az veri)' : ''}${g.eng != null ? ' · etkileşim %' + g.eng : ''}"><b>${esc(label)}</b><span>${xs(g.median)}</span><small>${g.n} video${g.eng != null ? ' · %' + g.eng : ''}</small></div>`;
  const best = (list) => { const ok = list.filter(g => !g.few && g.median != null); return ok.length ? ok.reduce((m, g) => g.median > m.median ? g : m) : null; };
  const bd = best(I.weekday), bh = best(I.hour), bu = best(I.duration);
  const trend = I.trend ? `<span class="vchip ${I.trend.label === 'büyüyor' ? 'ok' : I.trend.label === 'soğuyor' ? 'bad' : 'muted'}" title="Son 30 gün medyan güç ${I.trend.recent}× (${I.trend.recent_n} video), önceki 90 gün ${I.trend.before}× (${I.trend.before_n} video)">Trend: ${I.trend.label}</span>` : '';
  const feats = I.features.filter(f => f.lift != null).map(f => `<tr><td>${esc(f.feature)}</td><td class="num">${f.n_yes} / ${f.n_no}</td><td class="num">${xs(f.med_yes)} / ${xs(f.med_no)}</td><td class="num">${f.eng_yes != null ? pc(f.eng_yes) + ' / ' + pc(f.eng_no) : '–'}</td><td class="num">${f.few ? '<span class="stat">az veri</span>' : `<span class="x ${f.lift >= 1.25 ? 'hot' : f.lift <= 0.8 ? 'cold' : ''}">${f.lift}×</span>`}</td></tr>`).join('');
  const kws = (I.keywords || []).map(k => `<div class="icell"><b>${esc(k.word)}</b><span>${xs(k.median)}</span><small>${k.n} video${k.eng != null ? ' · %' + k.eng : ''}</small></div>`).join('');
  return `<div class="insights"><div class="ihead"><b>Hangi tür içerik tutuyor?</b>${trend}
      <span class="stat">Değerler “güç” medyanı (1× = hesabın tipik videosu); altında video sayısı ve medyan etkileşim. Küçük örnekte kanıt değil, ipucu.</span></div>
    ${I.duration.length ? `<div class="igrp"><h4>Süre ${bu ? `<small>en iyi: ${esc(bu.bucket)}</small>` : ''}</h4><div class="icells">${I.duration.map(g => cell(g.bucket, g)).join('')}</div></div>` : ''}
    <div class="igrp"><h4>Haftanın günü ${bd ? `<small>en iyi: ${esc(bd.day)}</small>` : ''}</h4><div class="icells">${I.weekday.map(g => cell(g.day, g)).join('')}</div></div>
    ${I.hour.length ? `<div class="igrp"><h4>Saat dilimi ${bh ? `<small>en iyi: ${esc(bh.slot)}</small>` : ''}</h4><div class="icells">${I.hour.map(g => cell(g.slot, g)).join('')}</div></div>` : ''}
    ${Object.keys(I.formats).length ? `<div class="igrp"><h4>Biçim</h4><div class="icells">${Object.entries(I.formats).map(([k, v]) => `<div class="icell"><b>${k === 'short' ? 'Short' : 'Uzun'}</b><span>${fmt(v.median_views)}</span><small>${v.n} video · medyan izlenme</small></div>`).join('')}</div></div>` : ''}
    ${kws ? `<div class="igrp wide"><h4>Konu (başlıktaki anahtar kelime)</h4><div class="icells">${kws}</div></div>` : ''}
    ${feats ? `<div class="igrp wide"><h4>Başlık özelliği etkisi <small>var / yok</small></h4><div class="scrollx"><table class="tbl"><thead><tr><th>Özellik</th><th class="num">Video</th><th class="num">Medyan güç</th><th class="num">Etkileşim</th><th class="num">Etki</th></tr></thead><tbody>${feats}</tbody></table></div></div>` : ''}
    ${I.hashtags.length ? `<div class="igrp wide"><h4>Hashtag</h4><div class="icells">${I.hashtags.map(h => `<div class="icell"><b>${esc(h.tag)}</b><span>${xs(h.median)}</span><small>${h.n} video${h.eng != null ? ' · %' + h.eng : ''}</small></div>`).join('')}</div></div>` : ''}</div>`;
}

function planBlock(b) {
  const p = b.plan; if (!p) return '';
  const pct = p.progress == null ? 0 : Math.round(p.progress * 100);
  let note = '';
  if (p.verdict === 'plan-yok') note = 'Bu marka için henüz planlanmış içerik yok. Aşağıdan toplu ekleyebilirsin.';
  else if (p.verdict === 'bitti') note = 'Planlanan tüm içerikler yüklendi.';
  else if (p.verdict === 'hiz-yok') note = `Henüz yüklenen iş olmadığı için bitiş tahmini yapılamıyor.${p.due_last ? ` Planlanan son tarih ${fdate(p.due_last)}.` : ''}`;
  else {
    note = `Son ${p.pace_window_days} günde haftada ${String(p.pace_per_week).replace('.', ',')} içerik yüklenmiş; kalan ${p.remaining} içerik bu hızla <b>${fdate(p.forecast)}</b> tarihinde biter.`;
    if (p.verdict === 'gecikme') note += ` Planlanan son tarihten (${fdate(p.due_last)}) yaklaşık <b>${p.late_days} gün sonra</b>: hızı artır ya da planı kısalt.`;
    else if (p.verdict === 'gecikmis-var') note += ` ${p.overdue} iş tarihini geçmiş.`;
  }
  const items = p.upcoming.map(t => `<li class="${t.overdue ? 'od' : ''}"><span class="rvst ${t.status === 'sorun' ? 'revizyon' : ''}">${esc(BST[t.status] || t.status)}</span> <b>${esc(t.title)}</b> <span class="stat">${esc([t.platform && PLAT[t.platform], t.due && 'son ' + fdate(t.due)].filter(Boolean).join(' · '))}${t.overdue ? ' · gecikmiş' : ''}</span></li>`).join('');
  return `<section class="planbox"><div class="ihead"><h2>İçerik planı</h2>${verdictChip(p)}<span class="stat">Bilgiler iş panosundaki işlerden gelir.</span><span class="grow"></span><a class="btn sm" href="#/pano">İş panosu</a></div>
    ${p.total ? `<div class="pbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="pstats"><div><b>${p.done} / ${p.total}</b><span>yüklendi (%${pct})</span></div><div><b>${p.remaining}</b><span>kalan${p.stuck ? ` · ${p.stuck} sorunlu` : ''}</span></div>
      <div><b>${fdate(p.due_next)}</b><span>sıradaki tarih</span></div><div><b>${fdate(p.due_last)}</b><span>planlanan son tarih</span></div><div><b>${p.forecast ? fdate(p.forecast) : '–'}</b><span>tahmini bitiş</span></div></div>` : ''}
    <p class="pnote">${note}</p>${items ? `<ul class="pitems">${items}</ul>` : ''}
    <details class="bulk"><summary>+ Toplu plan ekle</summary><form data-an="planform" data-brand="${b.id}"><label class="sr" for="plantext${b.id}">Planlanan içerikler</label>
      <textarea class="field" id="plantext${b.id}" rows="5" placeholder="Her satıra bir içerik: Başlık | son tarih (2026-11-03) | platform (youtube, tiktok, instagram)&#10;Örn: Maç arası altyazı denemesi | 2026-11-05 | youtube"></textarea>
      <div class="row"><select class="field" aria-label="Varsayılan platform"><option value="">Platform (satırda yoksa)</option>${Object.entries(PLAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select><button class="btn primary" type="submit">Plana ekle</button></div></form></details></section>`;
}

function accountRow(a) {
  const st = a.sync_status === 'calisiyor' ? 'çekiliyor…' : a.sync_status === 'tamam' ? 'güncel: ' + fday(a.synced_at) : a.sync_status === 'hata' ? '' : 'henüz çekilmedi';
  return `<div class="acc" data-acc="${a.id}"><div class="acchead"><span class="plat">${PLAT[a.platform]}</span><a href="#/analiz/h/${a.id}"><b>@${esc(a.handle)}</b></a>
      <span class="stat">${a.followers != null ? fmt(a.followers) + ' takipçi · ' : ''}${a.post_count} video${a.median_views != null ? ' · medyan ' + fmt(a.median_views) : ''} · ${st}</span><span class="grow"></span>
      <a class="btn sm primary" href="#/analiz/h/${a.id}">Analiz sayfası</a>
      ${a.platform === 'youtube' ? `<button class="btn sm" data-act="ansync" ${a.sync_status === 'calisiyor' ? 'disabled' : ''}>Verileri çek</button>` : ''}
      <button class="btn sm" data-act="anpost">Video linki ekle</button>
      <button class="btn sm ghost danger" data-act="andel" aria-label="Hesabı kaldır">✕</button></div>
    ${a.sync_error ? `<div class="err">${esc(a.sync_error)}</div>` : ''}</div>`;
}

const topRec = (a) => (a.recs || []).find(r => r.level === 'yap' || r.level === 'uyari');
function accountCompare(b) {
  if (!b.accounts.length) return '<p class="empty">Bu markada henüz hesap yok. “+ Hesap ekle” ile ekle; bir markaya istediğin kadar hesap ekleyebilirsin.</p>';
  const rows = [...b.accounts].sort((x, y) => (y.median_views || 0) - (x.median_views || 0)).map(a => {
    const tr = a.insights?.trend;
    return `<tr><td><a href="#/analiz/h/${a.id}"><b>${esc(accLabel(a))}</b></a></td><td class="num">${fmt(a.followers)}</td><td class="num">${a.post_count}</td><td class="num">${fmt(a.median_views)}</td><td class="num">${pc(a.median_engagement)}</td>
      <td>${tr ? `<span class="vchip ${tr.label === 'büyüyor' ? 'ok' : tr.label === 'soğuyor' ? 'bad' : 'muted'}">${tr.label}</span>` : '–'}</td>
      <td>${topRec(a) ? esc(topRec(a).text.slice(0, 90)) : '<span class="stat">veri az</span>'}</td></tr>`;
  }).join('');

/* ---------- Video içi analiz (hook / orta / ses) ---------- */
const VA_SECTION = {hook: 'Hook (ilk 3 saniye)', orta: 'Orta (sıkıcılaşan bölümler)', ritim: 'Ritim', ses: 'Ses', bitis: 'Bitiş'};
const VA_ICON = {sorun: '🔴', dikkat: '🟡', iyi: '🟢'};
const vaTime = (sec) => { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
const vaCls = (v) => v >= 75 ? 'ok' : v >= 50 ? 'warn' : 'bad';
const VA = {timers: {}};
function vaTimeline(res) {
  const tl = res.timeline, n = tl.seconds, low = res.features.low_zones || [];
  const bars = tl.energy.map((e, i) => `<rect x="${i + 0.05}" y="${56 - Math.max(0.5, e * 52)}" width="0.9" height="${Math.max(0.5, e * 52)}" class="vb ${e < 0.22 ? 'low' : ''}"><title>${vaTime(i)} · enerji ${e}${tl.loud[i] != null ? ' · ' + tl.loud[i] + ' LUFS' : ''}${tl.cuts[i] ? ' · kesme' : ''}</title></rect>`).join('');
  const cuts = tl.cut_times.map(t => `<line x1="${t}" x2="${t}" y1="0" y2="58" class="vc"/>`).join('');
  const lows = low.map(z => `<rect x="${z.start}" y="0" width="${z.end - z.start}" height="58" class="vlow"/>`).join('');
  const step = n > 600 ? 120 : n > 180 ? 30 : 5;
  const ticks = Array.from({length: Math.floor(n / step) + 1}, (_, k) => k * step).filter(t => t <= n).map(t => `<span style="left:${t / Math.max(n, 6) * 100}%">${vaTime(t)}</span>`).join('');
  return `<svg class="vatl" viewBox="0 0 ${Math.max(n, 6)} 58" preserveAspectRatio="none" role="img" aria-label="Saniye bazlı enerji grafiği">
    <rect x="0" y="0" width="${Math.min(3, n)}" height="58" class="vhook"/>${lows}${bars}${cuts}</svg><div class="vticks">${ticks}</div>
    <div class="vleg"><span><i class="lg hook"></i>ilk 3 sn (hook)</span><span><i class="lg low"></i>düşük enerji bölümü</span><span><i class="lg cut"></i>kesme</span><span class="stat">Çubuk = saniyenin enerjisi (hareket + ses + kesme)</span></div>`;
}
function vaRender(box, key, rec, title, seekable) {
  if (!box.isConnected) return;
  if (rec.status === 'none') {
    box.innerHTML = `<section class="brandbox"><h2>Video analizi</h2><p>Videoyu analiz edip <b>hook</b>, <b>ortada sıkıcılaşan bölümler</b>, ritim ve ses için brief çıkarır. ${key.startsWith('post') ? 'Herkese açık videoyu küçük çözünürlükte indirir (1-2 dakika sürebilir).' : ''}</p>
      <button class="btn primary" data-va="start" data-key="${key}">Analiz et</button></section>`;
    return;
  }
  if (rec.status === 'queued' || rec.status === 'running') {
    box.innerHTML = `<section class="brandbox"><h2>Video analizi</h2><p>⏳ Analiz sürüyor… (${rec.status === 'queued' ? 'sırada' : 'çalışıyor'}) Bu sayfa kendiliğinden güncellenir.</p></section>`;
    clearTimeout(VA.timers[key]); VA.timers[key] = setTimeout(() => vaMount(box, key, title, seekable), 3000); return;
  }
  if (rec.status === 'error') {
    box.innerHTML = `<section class="brandbox"><h2>Video analizi</h2><div class="err">${esc(rec.error || 'Analiz başarısız')}</div><button class="btn" data-va="start" data-key="${key}">Tekrar dene</button></section>`;
    return;
  }
  const r = rec.result, f = r.features, sc = r.scores;
  const chip = (k, l) => `<div class="vsc ${vaCls(sc[k])}"><b>${sc[k]}</b><span>${l}</span></div>`;
  const groups = Object.keys(VA_SECTION).map(k => [k, r.briefs.filter(b => b.section === k)]).filter(([, l]) => l.length);
  const brief = (b) => `<div class="vbrief ${b.level}"><span aria-hidden="true">${VA_ICON[b.level]}</span><div>
      <span class="vwhen">${seekable ? `<button class="rvts" data-rv="seek" data-t="${b.at[0]}">${vaTime(b.at[0])}–${vaTime(b.at[1])}</button>` : `${vaTime(b.at[0])}–${vaTime(b.at[1])}`}</span> ${esc(b.text)}
      ${b.fix ? `<div class="vfix"><b>Ne yap:</b> ${esc(b.fix)}</div>` : ''}</div></div>`;
  const nums = [['Süre', vaTime(f.duration)], ['Kesme', f.cut_count], ['Ort. plan', f.avg_shot != null ? f.avg_shot + ' sn' : '–'], ['İlk kesme', f.first_cut != null ? f.first_cut + ' sn' : 'yok'],
    ['Ses başlangıcı', f.audio_start != null ? f.audio_start + ' sn' : (f.has_audio ? '–' : 'ses yok')], ['Ses seviyesi', f.integrated_lufs != null ? f.integrated_lufs + ' LUFS' : '–'], ['Sessizlik', f.silence_ratio != null ? '%' + Math.round(f.silence_ratio * 100) : '–']];
  box.innerHTML = `<section class="brandbox"><div class="ihead"><h2>Video analizi</h2><span class="grow"></span><button class="btn sm" data-va="claude" data-key="${key}" data-title="${esc(title || '')}">Claude’a ver (derin yorum)</button><button class="btn sm ghost" data-va="start" data-key="${key}">Yeniden analiz et</button></div>
    <div class="vscores">${chip('hook', 'Hook')}${chip('orta', 'Orta')}${chip('ritim', 'Ritim')}${chip('ses', 'Ses')}${chip('bitis', 'Bitiş')}</div>
    ${vaTimeline(r)}
    <div class="vnums">${nums.map(([k, v]) => `<div><b>${esc(String(v))}</b><span>${k}</span></div>`).join('')}</div>
    ${groups.length ? groups.map(([k, list]) => `<h3 class="vsec">${VA_SECTION[k]}</h3>${list.map(brief).join('')}`).join('') : '<p class="empty">Belirgin bir sorun bulunmadı.</p>'}
    <p class="stat" style="margin-top:10px">Otomatik tahmin: görüntü değişimi, kesme, sessizlik ve ses seviyesinden hesaplanır. İzleyicinin gerçekte nerede bıraktığı için platform panelindeki tutma eğrisine de bak. Konuşma metni ve yüz/yazı analizi sonraki sürümde.</p></section>`;
}
async function vaMount(box, key, title, seekable) {
  try { vaRender(box, key, await api('GET', `/api/analysis/${key.replace(':', '/')}`), title, seekable); } catch (e) { if (box.isConnected) box.innerHTML = '<p class="empty">Analiz bilgisi alınamadı.</p>'; }
}

const boardBusy = () => ['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement?.tagName) ||

async function loadBoard(force) {

function renderBoard() {

  const B = S.board, live = B.batches.filter(b => b.state !== 'bitti').sort((x, y) => x.days_left - y.days_left), cur = live[0] || B.batches[0];
  const others = B.batches.filter(b => b !== cur);
  const brands = [...new Set((S.an?.brands || []).map(x => x.brand))];
  if (!S.an && !S.anTried) { S.anTried = true; api('GET', '/api/analytics').then(x => { S.an = x; if (!boardBusy()) render(); }).catch(() => {}); }
  const banner = cur ? `<div class="banner ${cur.state}"><div class="grow"><b>${esc(cur.title)}</b>: ${esc(cur.start_date)} → ${esc(cur.end_date)} · ${cur.state === 'bitti' ? 'dönem bitti' : cur.days_left === 0 ? 'bugün son gün' : cur.days_left + ' gün kaldı'}

  $('#view').innerHTML = `<div class="an"><div class="pagehead"><h1 tabindex="-1">İş panosu</h1><span class="meta">${B.tasks.filter(t => t.status !== 'yuklendi').length} açık iş</span></div>
    <p class="hint">Yüklenecek/üretilecek işler ve durumları burada. Ben (Claude) bir oturumda çalıştığımda durumları güncellerim; sen de iş ekleyebilir, not düşebilirsin.</p>
    ${banner}
    <form class="newbatch addtodo" data-form="batch"><label class="sr" for="bstart">Dönem başlangıcı</label><input class="field" id="bstart" type="date" required>
      <input class="field" id="btitle" maxlength="100" placeholder="Dönem adı (örn. Kasım 1. yarı)"><button class="btn" type="submit">2 haftalık dönem başlat</button></form>
    <form class="newtask" data-form="task"><input class="field" id="ttitle" maxlength="200" placeholder="Yeni iş (örn. 3 reels yükle)" required aria-label="İş başlığı">

    <div class="feed" id="feed">${B.messages.map(m => `<div class="msg ${esc(m.author)}"><span class="who">${m.author === 'sen' ? 'Sen' : m.author === 'claude' ? 'Claude' : 'Sistem'}</span>${esc(m.text)}<time>${dt(m.created_at)}</time></div>`).join('') || '<p class="empty">Henüz mesaj yok.</p>'}</div>
    <form class="sendmsg" data-form="msg"><input class="field" id="mtext" maxlength="2000" placeholder="Claude'a not bırak (bir sonraki oturumda okurum)" aria-label="Mesaj"><button class="btn primary" type="submit">Gönder</button></form></div>`;

/* ---------- Notlar (todo listesi) ---------- */
function todoRow(t) {
  const snip = esc(t.text.length > 40 ? t.text.slice(0, 40) + '…' : t.text);
  return `<li class="todo ${t.done ? 'is-done' : ''}" data-todo="${t.id}">
    <label class="chk"><input type="checkbox" data-act="todotoggle" ${t.done ? 'checked' : ''} aria-label="Tamamlandı: ${snip}"><span class="box" aria-hidden="true"></span></label>
    <textarea class="todo-text" data-act="todotext" rows="1" maxlength="500" aria-label="Not metni">${esc(t.text)}</textarea>
    <button class="btn sm ghost" data-act="tododel" aria-label="Notu sil: ${snip}">✕</button></li>`;
}
function growTodos() { document.querySelectorAll('.todo-text').forEach(el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }); }
function renderNotes() {
  const open = S.todos.filter(t => !t.done), done = S.todos.filter(t => t.done);
  $('#view').innerHTML = `<div class="notes"><div class="pagehead"><h1 tabindex="-1">Notlar</h1><span class="meta">${open.length} açık</span></div>
    <p class="hint">Genel notların ve yapılacaklar burada. Bir videoya özel not ise o videonun kartındaki “Not ekle” alanında durur.</p>
    <form class="addtodo"><label class="sr" for="newtodo">Yeni not</label>
      <input class="field" id="newtodo" maxlength="500" autocomplete="off" placeholder="Yeni not veya yapılacak yaz, Enter ile ekle"><button class="btn primary" type="submit">Ekle</button></form>
    ${open.length ? `<ul class="todos" aria-label="Açık notlar">${open.map(todoRow).join('')}</ul>` : '<p class="empty">Açık not yok. Yukarıya bir şey yazıp Enter’a bas.</p>'}
    ${done.length ? `<div class="donehead"><h2>Tamamlananlar</h2><span class="n">${done.length}</span><span style="flex:1"></span>
      <button class="btn sm ghost" data-act="todoclear">Tamamlananları temizle</button></div>
      <ul class="todos" aria-label="Tamamlanan notlar">${done.map(todoRow).join('')}</ul>` : ''}</div>`;
  growTodos();
}

/* ---------- Diyalog ---------- */
function dialog({title, text = '', fields = [], confirm = 'Kaydet', danger = false, error = ''}) {
  return new Promise((resolve) => {
    const d = $('#dlg');
    d.innerHTML = `<form method="dialog"><h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ''}${error ? `<p role="alert" style="color:var(--danger)">${esc(error)}</p>` : ''}
      ${fields.map((f, i) => `<label for="f${i}">${esc(f.label)}</label>` + (f.options
        ? `<select class="field" id="f${i}">${f.options.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select>`
        : `<input class="field" id="f${i}" value="${esc(f.value || '')}" maxlength="300" autocomplete="off">`)).join('')}
      <div class="actions"><button class="btn" value="cancel" formnovalidate>Vazgeç</button>
      <button class="btn ${danger ? 'danger' : 'primary'}" value="ok">${esc(confirm)}</button></div></form>`;
    // close olayına değil submit/cancel'a bağlı: her tarayıcıda aynı sırayla çalışır
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    d.querySelector('form').addEventListener('submit', (ev) => {
      finish(ev.submitter && ev.submitter.value === 'ok' ? fields.map((_, i) => $('#f' + i).value) : null);
    });
    d.onclose = () => finish(null);  // Esc veya dışarıdan kapanma
    d.returnValue = ''; d.showModal();
    const first = d.querySelector('input,select'); if (first) { first.focus(); if (first.select) first.select(); }
  });
}

// Diyalog hata verirse yazdıkların silinmeden, hata mesajıyla yeniden açılır
async function ask(opts, fn) {
  let o = opts;
  for (;;) {
    const v = await dialog(o); if (!v) return null;
    S.lastError = '';
    if (await fn(v)) return v;
    o = {...opts, fields: opts.fields.map((f, i) => ({...f, value: v[i]})), error: S.lastError || 'Kaydedilemedi'};
  }
}

async function catalog(path, body, okMsg) {
  const r = await run('POST', '/api/catalog/' + path, body);
  if (!r) return false;
  if (okMsg) toast(okMsg);
  await load(true);
  document.querySelector('.pagehead h1')?.focus({preventScroll: true});  // odak sayfa başlığına: klavye/ekran okuyucu bağlamı kaybolmasın
  return true;
}

document.addEventListener('click', async (e) => {

      fields: [{label: 'Marka', value: r.brand || brands[0] || ''}, {label: 'Platform', options: [{value: 'youtube', label: 'YouTube'}, {value: 'tiktok', label: 'TikTok'}, {value: 'instagram', label: 'Instagram'}]}, {label: 'Kullanıcı adı veya link'}]},
      async (v) => { const x = await run('POST', '/api/analytics/accounts', {brand: v[0], platform: v[1], handle: v[2]}); if (x) S.an = x; return !!x; });
    if (v) { toast('Hesap eklendi'); render(); }

  }
  if (act === 'ansync' || act === 'anpost' || act === 'andel') {

    if (act === 'ansync') { const ok = await run('POST', `/api/analytics/accounts/${aid}/sync`); if (ok) toast('Veri çekimi başladı'); await loadAnalytics(); }
    else if (act === 'andel') { if (confirm('Hesap ve çekilmiş tüm verisi silinsin mi?')) { await run('DELETE', `/api/analytics/accounts/${aid}`); await loadAnalytics(); } }
    else {
      const v = await ask({title: 'Video linki ekle', text: 'Videonun linkini yapıştır; izlenme, beğeni ve yorum sayıları çekilir.', confirm: 'Çek', fields: [{label: 'Video linki'}]},
        async (v) => { const x = await run('POST', `/api/analytics/accounts/${aid}/posts`, {url: v[0]}); if (x) S.an = x; return !!x; });
      if (v) { toast('Video eklendi'); render(); }

  // --- kategori / alt başlık yönetimi ---
  if (act === 'catadd') {
    const v = await ask({title: 'Yeni kategori', text: 'Kategori ve içine koyacağın ilk alt başlığı yaz.', fields: [{label: 'Kategori adı'}, {label: 'İlk alt başlık'}], confirm: 'Ekle'},

    if (v) location.hash = '#/k/' + encodeURIComponent(v[0].trim().replace(/\s+/g, ' '));

  }
  if (act === 'catmove') { await catalog('category/move', {name: cat.name, direction: dir}); return; }
  if (act === 'catdel') {
    const n = count(cat.name), others = S.cats.filter(c => c !== cat);

      text: n ? `İçinde ${n} video var. Videolar silinmez, seçtiğin başlığa taşınır.` : 'Başlık boş, hemen silinir.',
      fields: n ? [{label: 'Videolar nereye taşınsın?', options: others.map(s => ({value: s, label: s}))}] : []});
    if (v) await catalog('sub/delete', {category: cat.name, name: sub, move_to_sub: n ? v[0] : ''}, 'Alt başlık silindi');
    return;
  }

  // --- genel notlar ---
  if (act === 'tododel') {
    const tid = b.closest('[data-todo]')?.dataset.todo;

  }
  if (act === 'todoclear') {
    if (!confirm('Tamamlanan tüm notlar silinsin mi?')) return;
    const rr = await run('POST', '/api/todos/clear-done'); if (rr) toast(`${rr.removed} not silindi`); await load(); return;
  }

  // --- video ve plan kartı işlemleri ---
  if (act === 'dl') { await run('POST', `/api/items/${id}/download`); toast('İndirme sıraya alındı'); }
  else if (act === 'dlsub') { const rr = await run('POST', '/api/download-sub', {category: cat.name, subcategory: sub}); if (rr) toast(`${rr.queued} video sıraya alındı`); }
  else if (act === 'del') { if (!confirm('Bu video silinsin mi?')) return; await run('DELETE', `/api/items/${id}`); }
  else if (act === 'newcard') { const t = $('#newtitle').value.trim(); if (!t) return toast('Kart için bir başlık yaz'); await run('POST', '/api/cards', {title: t}); }
  else if (act === 'delcard') { if (!confirm('Kart silinsin mi? Videolar silinmez.')) return; await run('DELETE', `/api/cards/${cid}`); }
  else if (act === 'up' || act === 'down') await run('PATCH', `/api/cards/${cid}/items/${vid}`, {move: act === 'up' ? -1 : 1});
  else if (act === 'rmvid') await run('DELETE', `/api/cards/${cid}/items/${vid}`);
  else return;

// "Claude'a ver" penceresi: istemi gösterir, seçili tutar, tek tıkla kopyalar (pano engellenirse Ctrl+C ile elle de alınır)
const SHORT_PROMPT = 'Bekleyen revizyonları yap: izle.py bekleyen komutunu çalıştır, notlara göre düzelt, yeni sürümü yükle.';
async function showPrompt(text, title) {
  const d = $('#dlg');
  d.innerHTML = `<form method="dialog" class="pdlg"><h2>${esc(title || 'Claude’a ver')}</h2>
    <ol class="psteps"><li>Claude’u bu bilgisayarda aç.</li><li>Aşağıdaki metni yapıştır (ya da kısa komutu yaz). Claude notlara göre düzeltip yeni sürümü buraya yükler.</li></ol>
    <textarea class="field" id="ptext" readonly rows="11" aria-label="Claude’a verilecek istem">${esc(text)}</textarea>
    <div class="actions"><button type="button" class="btn" id="pshort">Kısa komutu kopyala</button>
      <button class="btn" value="cancel" formnovalidate>Kapat</button><button type="button" class="btn primary" id="pfull">İstemi kopyala</button></div></form>`;
  const ta = $('#ptext'), bf = $('#pfull'), bs = $('#pshort');
  const mark = (b, label, ok) => { const old = b.dataset.l || b.textContent; b.dataset.l = old; b.textContent = ok ? '✓ Kopyalandı' : 'Seçili: Ctrl+C bas'; setTimeout(() => { b.textContent = old; }, 2200); };
  bf.addEventListener('click', async () => { ta.focus(); ta.select(); mark(bf, '', await copyText(text)); });
  bs.addEventListener('click', async () => mark(bs, '', await copyText(SHORT_PROMPT)));
  d.returnValue = ''; d.showModal(); ta.focus(); ta.select();
  copyText(text).then(ok => { if (ok) mark(bf, '', true); });  // açılır açılmaz da dener
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
  ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
}

document.addEventListener('change', async (e) => {
  const t = e.target, act = t.dataset.act; if (!act) return;
  if (act === 'tstatus' || act === 'tnote') {
    const tid = t.closest('[data-task]').dataset.task;
    const x = await run('PATCH', `/api/board/tasks/${tid}`, act === 'tstatus' ? {status: t.value} : {note: t.value});

  }
  const cid = t.closest('[data-card]')?.dataset.card, vid = t.closest('[data-item]')?.dataset.item;
  // Not/başlık düzenlemelerinde ekran yeniden ÇİZİLMEZ (yazdığın alan bozulmasın); sadece kaydedilir
  const saveInPlace = async (body, path) => { const rr = await run('PATCH', path, body); const i = S.cards.findIndex(c => c.id === +cid); if (rr && i >= 0) S.cards[i] = rr; };
  if (act === 'todotoggle') {
    const tid = t.closest('[data-todo]').dataset.todo;
    await run('PATCH', `/api/todos/${tid}`, {done: t.checked}); await load(true);
    document.querySelector(`[data-todo="${tid}"] [data-act="todotoggle"]`)?.focus(); return;
  }
  if (act === 'todotext') {

document.addEventListener('click', async (e) => {

  if (await rvTreeAct(b, act)) return;
  if (S.rv.doc && await docAct(b, act)) return;
  if (act === 'seek' && vd) { vd.pause(); vd.currentTime = +b.dataset.t; return; }
  if (act === 'step' && vd) { vd.pause(); vd.currentTime = Math.max(0, Math.min(vd.duration || 1e9, vd.currentTime + +b.dataset.d)); if (S.rv.hold !== null) S.rv.hold = vd.currentTime; return; }

  if (act === 'notedel') {
    const id = b.closest('[data-note]').dataset.note;
    try { await api('DELETE', `/api/review/notes/${id}`); rvAfter(await api('GET', `/api/review/videos/${v.id}`)); } catch (err) {}
    return;
  }
  if (act === 'approve') {
    try { rvAfter(await api('POST', `/api/review/videos/${v.id}/approve`)); toast('Onaylandı'); } catch (err) {}
    return;
  }
  if (act === 'go') {
    const n = v.versions[S.rv.ver].notes.length;
    const ok = await dialog({title: 'Değişikliğe başlansın mı?', text: `${n} not revizyon isteği olarak kaydedilecek. Claude bir sonraki oturumda (veya şimdi “bekleyen revizyonları yap” dediğinde) videoyu bu notlara göre yeniden üretir.`, confirm: 'Değişikliğe başla'});
    if (!ok) return;
    try {
      const res = await api('POST', `/api/review/videos/${v.id}/revise`);

});
