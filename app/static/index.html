function nthIndex(content, quote, occ) {
  let from = 0, idx = -1, first = -1;
  for (let k = 0; k <= occ; k++) { idx = content.indexOf(quote, from); if (idx < 0) break; if (k === 0) first = idx; from = idx + 1; }
  return idx >= 0 ? idx : first;  // sıra tutmuyorsa (metin değişti) ilk eşleşmeye düş
}
function docLines(d) {

  for (const l of lines) { starts.push(p); p += l.length + 1; }
  const cover = new Int32Array(d.content.length + 1);
  for (const c of d.comments) {
    const i = nthIndex(d.content, c.quote, c.occ); c.missing = i < 0;
    if (i >= 0) for (let k = i; k < i + c.quote.length; k++) if (!cover[k]) cover[k] = c.id;
  }

}

    i = j;

}

function docSelection() {
  const sel = getSelection(); if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0), root = $('#rdoc'); if (!root || !root.contains(r.commonAncestorContainer)) return null;
  let a = docOffset(r.startContainer, r.startOffset), b = docOffset(r.endContainer, r.endOffset);
  if (a < 0 || b < 0 || a === b) return null;
  if (a > b) [a, b] = [b, a];
  const c = S.rv.doc.content; while (a < b && /\s/.test(c[a])) a++; while (b > a && /\s/.test(c[b - 1])) b--;
  if (a >= b) return null;
  const quote = c.slice(a, b); let occ = 0, i = c.indexOf(quote);
  while (i >= 0 && i < a) { occ++; i = c.indexOf(quote, i + 1); }
  const line = c.slice(0, a).split('\n').length - 1;
  return {quote, occ, line, rect: r.getBoundingClientRect()};
}
function hideFloat() { document.querySelector('#rdfloat')?.remove(); }
document.addEventListener('mouseup', (e) => {
  if (!S.rv.doc || !$('#rdoc') || e.target.closest('#rdfloat') || S.rv.doc.status === 'revizyon') return;
  setTimeout(() => {
    hideFloat(); const s = docSelection(); if (!s || S.rv.edit) return;
    S.rv.sel = s;
    const b = document.createElement('button'); b.id = 'rdfloat'; b.className = 'btn primary sm'; b.textContent = '💬 Yorum ekle'; b.dataset.rv = 'cmstart';
    b.style.cssText = `position:fixed;z-index:30;left:${Math.max(8, Math.min(innerWidth - 150, s.rect.left + s.rect.width / 2 - 55))}px;top:${Math.min(innerHeight - 50, s.rect.bottom + 8)}px`;
    b.addEventListener('mousedown', (ev) => ev.preventDefault());
    document.body.appendChild(b);
  }, 0);
});
document.addEventListener('mousedown', (e) => { if (!e.target.closest('#rdfloat')) hideFloat(); });
async function docAct(b, act) {
  const d = S.rv.doc;
  if (act === 'cmstart') { S.rv.pend = S.rv.sel; hideFloat(); getSelection().removeAllRanges(); drawPend(); return true; }
  if (act === 'cmcancel') { S.rv.pend = null; drawPend(); return true; }
  if (act === 'fs') { S.rv.fs = Math.max(13, Math.min(34, S.rv.fs + +b.dataset.d * 2)); rvStore.set('fs', S.rv.fs); $('.rd').style.setProperty('--fs', S.rv.fs + 'px'); return true; }
  if (act === 'dir') { S.rv.dir = !S.rv.dir; rvStore.set('dir', S.rv.dir); drawDoc(); return true; }
  if (act === 'editall') { S.rv.edit = {all: true}; drawDocBody(); return true; }
  if (act === 'editline') { S.rv.edit = {line: +b.dataset.i}; drawDocBody(); return true; }
  if (act === 'canceledit') { S.rv.edit = null; drawDocBody(); return true; }
  const save = async (content) => {
    try { const res = await api('PUT', `/api/review/docs/${d.id}/content`, {content, expected_updated_at: d.updated_at}); S.rv.doc = res; S.rv.edit = null; drawDoc(); loadReviewList(true).catch(() => {}); toast('Kaydedildi'); }
    catch (e) {
      if (/başka yerden/.test(S.lastError)) {  // taslağı koru; güncel metni yükle, tekrar Kaydet'e basarsan bilerek üzerine yazılır
        const draft = ($('#rdline') || $('#rdall'))?.value, res = await api('GET', `/api/review/docs/${d.id}`);
        S.rv.doc = res; drawDocBody(); const ta = $('#rdline') || $('#rdall'); if (ta && draft !== undefined) ta.value = draft;
        toast('Metin başka yerden değişti. Taslağın duruyor; yine de Kaydet dersen güncel metnin üzerine yazar');
      }
    }
  };
  if (act === 'saveline') { const lines = d.content.split('\n'); lines[S.rv.edit.line] = $('#rdline').value; await save(lines.join('\n')); return true; }
  if (act === 'saveall') { await save($('#rdall').value); return true; }
  if (act === 'cmgo') { const id = b.closest('[data-cm]').dataset.cm, m = document.querySelector(`#rdoc mark[data-c="${id}"]`); if (m) { m.scrollIntoView({block: 'center', behavior: 'smooth'}); m.classList.add('flash'); setTimeout(() => m.classList.remove('flash'), 1400); } else toast('Bu cümle metinde artık yok'); return true; }
  if (act === 'cmdel') { const id = b.closest('[data-cm]').dataset.cm; try { await api('DELETE', `/api/review/comments/${id}`); S.rv.doc = await api('GET', `/api/review/docs/${d.id}`); drawDocBody(); loadReviewList(true).catch(() => {}); } catch (e) {} return true; }
  if (act === 'docapprove') { try { S.rv.doc = await api('POST', `/api/review/docs/${d.id}/approve`); drawDoc(); loadReviewList(true).catch(() => {}); toast('Onaylandı'); } catch (e) {} return true; }
  if (act === 'docgo') {
    const open = d.comments.filter(c => c.state === 'acik').length;
    if (!await dialog({title: 'Değişikliğe başlansın mı?', text: `${open} yorum${d.changes.length ? ` ve ${d.changes.length} elle düzenleme (silinen/eklenen cümleler)` : ''} revizyon isteği olarak kaydedilecek. Claude bir sonraki oturumda (veya “bekleyen revizyonları yap” dediğinde) metni buna göre günceller.`, confirm: 'Değişikliğe başla'})) return true;
    try { const res = await api('POST', `/api/review/docs/${d.id}/revise`); S.rv.doc = res.doc; drawDoc(); loadReviewList(true).catch(() => {}); toast('Revizyon istendi'); await showPrompt(res.prompt, 'Revizyon istendi: şimdi Claude’a ver'); } catch (e) {}
    return true;
  }
  if (act === 'copyprompt' && S.rv.key[0] === 'm') { try { await showPrompt(await api('GET', `/api/review/docs/${d.id}/prompt`), 'Claude’a ver: metin revizyonu'); } catch (e) {} return true; }
  return false;
}
document.addEventListener('submit', async (e) => {
  const f = e.target.closest('[data-rv=cmform]'); if (!f) return;
  e.preventDefault();
  const p = S.rv.pend, ta = $('#rdtext'), text = ta.value.trim(); if (!p || S.rv.busy) return;
  if (!text) { toast('Önce yorumu yaz'); return; }
  S.rv.busy = true; ta.value = '';
  try { S.rv.doc = await api('POST', `/api/review/docs/${S.rv.doc.id}/comments`, {quote: p.quote, text, line: p.line, occ: p.occ}); S.rv.pend = null; drawDocBody(); loadReviewList(true).catch(() => {}); toast('Yorum eklendi'); }
  catch (err) { if (!ta.value) ta.value = text; }
  finally { S.rv.busy = false; }
});
document.addEventListener('keydown', (e) => {
  if (!S.rv.doc || !$('.rd')) return;
  if (e.target.id === 'rdtext' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('[data-rv=cmform]').requestSubmit(); }
  else if (e.target.id === 'rdtext' && e.key === 'Escape') { S.rv.pend = null; drawPend(); }
  else if ((e.target.id === 'rdline' || e.target.id === 'rdall') && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); document.querySelector(`[data-rv=${e.target.id === 'rdall' ? 'saveall' : 'saveline'}]`).click(); }
  else if ((e.target.id === 'rdline' || e.target.id === 'rdall') && e.key === 'Escape') { S.rv.edit = null; drawDocBody(); }
});

/* ---------- Arama ve yenileme ---------- */
let qT;
$('#q').addEventListener('input', (e) => { S.q = e.target.value.trim(); clearTimeout(qT); qT = setTimeout(render, 120); });
$('#plat').addEventListener('change', (e) => { S.plat = e.target.value; render(); });
$('#notenav').addEventListener('click', () => { S.q = ''; S.plat = ''; $('#q').value = ''; $('#plat').value = ''; });
$('#plannav').addEventListener('click', () => { S.q = ''; S.plat = ''; $('#q').value = ''; $('#plat').value = ''; });
$('#catnav').addEventListener('click', (e) => { if (e.target.closest('a')) { S.q = ''; S.plat = ''; $('#q').value = ''; $('#plat').value = ''; } });

// Her 4 sn'de değişiklikleri çek (bottan gelen videolar, indirme durumu); yazarken/sürüklerken dokunma
setInterval(() => {
  const typing = ['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement?.tagName);
  if (!typing && dragId === null && !document.hidden && !document.querySelector('details.menu[open]') && !$('#dlg').open) {
    load().catch(() => {});
    if (route().view === 'board') loadBoard().catch(() => {});
    if (RVVIEWS.includes(route().view)) loadReviewList().catch(() => {});
    if (route().view === 'analytics' && S.an && S.an.brands.some(b => b.accounts.some(a => a.sync_status === 'calisiyor'))) loadAnalytics().catch(() => {});
  }
}, 4000);

load().catch(() => { $('#view').innerHTML = '<p class="empty">Sunucuya ulaşılamadı. python -m app çalışıyor mu?</p>'; });
</script>
